# Inference configuration for VeinGrower
# This config file is used by GrowerInference.py to run full-image vein inference

# Experiment metadata
experiment:
  name: "vein_grower_inference"
  description: "Inference with VeinGrower on full images"
  seed: 6783

# Model selection
model:
  type: "vein_grower"

# Vein grower CNN parameters (must match training config)
vein_grower:
  window_size: 128
  layers: [3, 32, 32, 32, 32, 64, 128]
  output_shape: [3, 3]
  output_activation: "softmax"
  dropout_rate: 0.3
  num_convs: 3

# Loss function (for reference)
loss:
  type: "fl"  # Options: "bce", "fl"
  focal_loss:
    gamma: 2.0
    alpha: 0.25

# Data paths and extensions
data:
  roi_extension: "png"
  image_extension: "jpeg"
  mask_extension: "png"

# Inference parameters
inference:
  # Model weights to load
  model_weights_path: "results/run_0511183535933370/weights/vein_grower_fl_128_best_val_model.save"
  
  # Input/output paths
  image_path: "../data_marion/images/"
  roi_path: "../data_marion/leaf_preds_sam3/"
  
  # Output paths for predictions
  pred_path: "../data_marion/vein_fl_preds_sam3/"
  prob_path: "../data_marion/vein_fl_probs_sam3/"
  
  # File extensions for outputs
  pred_extension: "png"
  prob_extension: "png"
  
  # Growing algorithm parameters
  n_locs: 10000              # Number of seed pixels to start growing from
  batch_size: 2048           # Batch size for CNN predictions
  threshold: null            # Threshold for binarizing predictions (null = use default)
  post_process: true         # Whether to apply post-processing (morphological operations)
  
  # Inference options
  max_number: null           # Maximum number of images to process (null = all images)
  verbose: true              # Print progress messages
  save: true                 # Save predictions to disk
  show: true                 # Display plots during inference
  fig_size: 15               # Figure size for plots
