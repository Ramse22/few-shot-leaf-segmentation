# Experiment metadata
experiment:
  name: "vein_grower_test"
  description: "TEST configuration - 10 patches only for local development"

# Model selection
model:
  type: "vein_grower"

# Vein grower CNN parameters
vein_grower:
  window_size: 128
  layers: [3, 32, 32, 32, 32, 64, 128]
  output_shape: [2, 3, 3]
  output_activation: "softmax"
  dropout_rate: 0.3
  num_convs: 3

# Leaf UNet parameters
leaf_unet:
  window_size: 256
  input_channels: 3
  output_channels: 1
  layers: [32, 32, 32, 32, 32, 64, 128]
  hidden_activation: "leaky_relu"
  output_activation: "sigmoid"
  dropout_rate: 0.0
  num_convs: 3

# Loss function
loss:
  type: "fl"  # Options: "bce", "fl"
  focal_loss:
    gamma: 2.0
    alpha: 0.25

# Optimizer settings
optimizer:
  learning_rate: 1.0e-3

# Training parameters
training:
  epochs: 5                # ← REDUCED from 1000 (quick test)
  batch_size: 16           # ← REDUCED from 1024 (saves memory)
  workers: 1               # ← REDUCED from 64 (avoid worker overhead)
  early_stopping: 5        # ← REDUCED from 20
  verbose: 2
  save_best_val: true
  use_amp: true

# Data paths and settings - POINT TO TEST PATCHES
data:
  image_path: "../data_marion/test_patches/image/"
  mask_path: "../data_marion/test_patches/vein_mask/"
  roi_path: "../data_marion/test_patches/leaf_mask/"
  weights_path: "../weights_test/"
  logs_path: "../logs_test/"
  image_extension: ".jpeg"
  mask_extension: ".png"
  roi_extension: ".png" 
  dilate: 50
  val_images:
    - "patch_00.png"       # ← Use first patch as validation
    - "patch_01.png"       # ← Use second patch as validation

# Learning rate scheduler
scheduler:
  type: "ReduceLROnPlateau"
  mode: "min"
  factor: 0.5
  patience: 2
  threshold: 1e-4
  verbose: true