data:
  dilate: 50
  image_extension: .jpeg
  image_path: ../data/images/
  logs_path: ../results/
  mask_extension: .png
  mask_path: ../data/vein_masks/
  roi_extension: .png
  roi_path: ../data/leaf_preds/
  val_split: 0.2
  weights_path: ../results/
experiment:
  description: first test with yaml
  name: vein_grower_test
  seed: 6783
leaf_unet:
  dropout_rate: 0.0
  hidden_activation: leaky_relu
  input_channels: 3
  layers:
  - 32
  - 32
  - 32
  - 32
  - 32
  - 64
  - 128
  num_convs: 3
  output_activation: sigmoid
  output_channels: 1
  window_size: 256
loss:
  focal_loss:
    alpha: 0.25
    gamma: 2.0
  type: fl
model:
  type: vein_grower
optimizer:
  learning_rate: 0.001
scheduler:
  factor: 0.5
  mode: min
  patience: 2
  threshold: 0.0001
  type: ReduceLROnPlateau
  verbose: true
training:
  batch_size: 1024
  early_stopping: 10
  epochs: 50
  save_best_val: true
  use_amp: true
  verbose: 2
  workers: 32
vein_grower:
  dropout_rate: 0.3
  layers:
  - 3
  - 32
  - 32
  - 32
  - 32
  - 64
  - 128
  num_convs: 3
  output_activation: softmax
  output_shape:
  - 2
  - 3
  - 3
  window_size: 128
